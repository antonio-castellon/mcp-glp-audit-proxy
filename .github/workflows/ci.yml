name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: SDK floor
        run: python -c "from mcp_glp_audit_proxy.sdkcheck import assert_mcp_floor; assert_mcp_floor()"
      - name: Unit tests
        run: python -m pytest -q --junitxml=junit.xml --cov=mcp_glp_audit_proxy --cov-report=term-missing
      - name: Traceability
        run: python -m mcp_glp_audit_proxy.verification.rtm junit.xml
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock --disable-pip --progress-spinner off
      - name: Bandit
        run: python -m bandit -r src -ll -q
      - name: Ruff security rules
        run: python -m ruff check src --select S
