name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: SDK floor
        run: python -c "from mcp_glp_audit_proxy.sdkcheck import assert_mcp_floor; assert_mcp_floor()"
      - name: Unit tests
        run: python -m pytest -q
