# Requirements traceability for the Community edition.
# A community row must name tests that pass. Pro and customer rows are not tested here.
# This file is evidence that supports a customer's own records. It is designed to
# support GLP / 21 CFR Part 11 / EU GMP Annex 11 workflows.
